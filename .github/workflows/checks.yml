name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache: false
      - name: Go format, vet, and tests (no private inputs)
        working-directory: apps/runner
        env:
          GOTOOLCHAIN: local
        run: |
          go mod download
          go mod verify
          test -z "$(gofmt -l cmd internal)"
          GOPROXY=off GOSUMDB=off go vet ./...
          GOPROXY=off GOSUMDB=off go test ./...
          go run ./cmd/runner verify-catalog --candidate ../../infra/runner/catalog/candidate.json
      - name: Validate public artifact tooling
        run: |
          python3 -m py_compile infra/runner/artifacts.py infra/runner/checkpoint_artifacts.py infra/runner/sandbox_test.py
          python3 -m unittest discover -s infra/runner -p 'test_*.py'
      - name: Build public Runner control plane
        run: docker build -f infra/docker/runner.Dockerfile apps/runner
      - name: Build pinned public Go sandbox (no private packs)
        run: docker build --network=none -f infra/docker/sandbox.Dockerfile infra/docker

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm curriculum:validate
      - run: pnpm build

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foundation_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/foundation_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL constraints, checkpoint timing/scoring/recovery, result application and privilege regressions
        run: pnpm test:db

  identity-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Create localhost-only development network
        run: docker network create -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 nextera-piscine-local
      - name: Start local Supabase without printing local keys
        run: mkdir -p .tools && pnpm supabase:start > .tools/supabase-start.log 2>&1
      - run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - run: pnpm local:env
      - run: pnpm build
      - run: pnpm test:auth
      - run: pnpm test:cohorts
      - if: always()
        run: pnpm supabase:stop
